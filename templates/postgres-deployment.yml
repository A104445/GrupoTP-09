apiVersion: apps/v1
kind: Deployment
metadata:
  name: airtrail-postgres
  namespace: default
  labels:
    app: airtrail-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airtrail-db
  template:
    metadata:
      labels:
        app: airtrail-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          startupProbe:
          exec:
            command: ["pg_isready", "-U", "airtrail"]
          periodSeconds: 5 
          failureThreshold: 20
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: airtrail-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: airtrail-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: airtrail-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/postgresql
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: airtrail-db-pvc-claim
