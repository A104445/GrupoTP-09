apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: airtrail-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: airtrail
  minReplicas: 2 # Mantém sempre pelo menos 2 para alta disponibilidade
  maxReplicas: 5 # Limite máximo para não esgotar os créditos GCP
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 # Escala se a média de CPU passar de 50%