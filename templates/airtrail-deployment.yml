apiVersion: apps/v1
kind: Deployment
metadata:
  name: airtrail
  namespace: default
  labels:
    app: airtrail
spec:
  selector:
    matchLabels:
      app: airtrail
  template:
    metadata:
      labels:
        app: airtrail
    spec:
      containers:
        - name: airtrail
          image: johly/airtrail:v3.2.2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          envFrom:
            - configMapRef: { name: airtrail-config }
            - secretRef: { name: airtrail-secrets }
          env:
            - name: PRISMA_DISABLE_ENV_LOAD
              value: "1"
      restartPolicy: Always
